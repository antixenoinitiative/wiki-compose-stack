name: Publish tools image

on:
  workflow_run:
    workflows: ["Validate stack"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-wiki-tools-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check whether this is still the latest main revision
        id: current
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main revision exists; skipping this publication." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/login-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.publish == 'true'

      - name: Build and publish main image
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tools.Dockerfile
          push: true
          tags: ghcr.io/antixenoinitiative/wiki-compose-tools:main
          labels: |
            org.opencontainers.image.source=https://github.com/antixenoinitiative/wiki-compose-stack

      - name: Summarize publication
        if: steps.current.outputs.publish == 'true'
        run: |
          echo 'Published ghcr.io/antixenoinitiative/wiki-compose-tools:main' >> "$GITHUB_STEP_SUMMARY"
