name: Publish tools image

on:
  workflow_run:
    workflows: ["Validate stack"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-wiki-tools-main
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check whether this is still the latest main revision
        id: current
        shell: bash
        run: |
          git fetch origin main
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main revision exists; skipping this publication." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: docker/login-action@v3
        if: steps.current.outputs.publish == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: steps.current.outputs.publish == 'true'

      - name: Build and publish main image
        if: steps.current.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tools.Dockerfile
          push: true
          tags: ghcr.io/antixenoinitiative/wiki-compose-tools:main
          labels: |
            org.opencontainers.image.source=https://github.com/antixenoinitiative/wiki-compose-stack

      - name: Signal the published image to Portainer
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Image published, but main advanced during the build. Leaving the newer revision unchanged; its validation/publication will handle deployment." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PYTHON'
          import os
          import re
          from pathlib import Path

          path = Path("compose.managed.yaml")
          content = path.read_text()
          marker = 'x-axi-tools-publication: "{}-{}"'.format(
              os.environ["GITHUB_RUN_ID"], os.environ["GITHUB_RUN_ATTEMPT"]
          )
          pattern = r'^x-axi-tools-publication:[^\n]*$'
          matches = re.findall(pattern, content, flags=re.MULTILINE)
          if len(matches) > 1:
              raise SystemExit("Duplicate publication markers; refusing to modify Compose")
          if matches:
              content = re.sub(pattern, marker, content, flags=re.MULTILINE)
          else:
              content = marker + "\n" + content
          path.write_text(content)
          PYTHON

          DB_ADMIN_PASSWORD=validation-only \
          DB_PASSWORD=validation-only \
          POSTGRES_VOLUME_NAME=validation-only \
            docker compose -f compose.managed.yaml config --quiet

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- compose.managed.yaml
          git commit -m "Refresh tools deployment after publication"
          if ! git push origin HEAD:refs/heads/main; then
            echo "::error::Image published, but the deployment signal could not be pushed. Check branch rules, Actions permissions, or a concurrent main update. No force push was attempted."
            exit 1
          fi

          echo 'Published ghcr.io/antixenoinitiative/wiki-compose-tools:main and committed the deployment signal. Portainer will process it on the next source poll.' >> "$GITHUB_STEP_SUMMARY"
