name: Validate stack

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          PREVIEW_DB_PASSWORD: validation-only
          PREVIEW_ADMIN_EMAIL: admin@example.invalid
          PREVIEW_ADMIN_PASSWORD: validation-only
        run: docker compose -f compose.managed.yaml config --quiet
