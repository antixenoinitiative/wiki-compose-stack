x-axi-tools-publication: "34340591488-1"
# Prepared replacement for compose.yaml; see docs/rollout.md before switching.
services:
  db:
    image: postgres:14.24
    container_name: axi-wiki-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in Portainer}
      POSTGRES_DB: wiki_db
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d wiki_db
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: local
  wiki:
    image: requarks/wiki:2.5.289
    container_name: axi-wiki-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      branding:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: wiki_db_user
      DB_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in Portainer}
      DB_NAME: wiki_db
      DB_SSL: 'false'
    ports:
    - 127.0.0.1:3000:3000
    volumes:
    - wiki_data:/wiki/data
    - branding_data:/branding:ro
    logging:
      driver: local
    command:
    - /bin/sh
    - /branding/wiki-start.sh
  caddy:
    image: caddy:2
    container_name: axi-wiki-caddy
    restart: unless-stopped
    depends_on:
    - wiki
    command:
    - caddy
    - reverse-proxy
    - --from
    - wiki.antixenoinitiative.com
    - --to
    - http://wiki:3000
    ports:
    - 80:80
    - 443:443
    volumes:
    - caddy_data:/data
    - caddy_config:/config
    logging:
      driver: local
  branding:
    image: ghcr.io/antixenoinitiative/wiki-compose-tools:main
    pull_policy: always
    container_name: axi-wiki-branding
    restart: unless-stopped
    init: true
    entrypoint:
    - python3
    - /app/branding.py
    environment:
      BRANDING_URL: https://raw.githubusercontent.com/antixenoinitiative/wiki-compose-stack/main/branding
      BRANDING_INTERVAL_SECONDS: '300'
    volumes:
    - branding_data:/branding
    healthcheck:
      test:
      - CMD
      - python3
      - /app/branding.py
      - --check
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    logging:
      driver: local
  backup:
    image: ghcr.io/antixenoinitiative/wiki-compose-tools:main
    pull_policy: always
    container_name: axi-wiki-backup
    restart: unless-stopped
    init: true
    entrypoint:
    - /bin/sh
    - /app/backup.sh
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: wiki_db
      PGUSER: wiki_db_user
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in Portainer}
      BACKUP_INTERVAL_SECONDS: '86400'
    volumes:
    - backup_data:/backups
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import os,time; assert time.time()-os.stat('/backups/.last-success').st_mtime
        < 172800
      interval: 5m
      timeout: 5s
      retries: 2
      start_period: 10m
    logging:
      driver: local
volumes:
  postgres_data:
    external: true
    name: ${POSTGRES_VOLUME_NAME:?Set the existing PostgreSQL volume name}
  wiki_data: null
  caddy_data: null
  caddy_config: null
  branding_data: null
  backup_data: null
