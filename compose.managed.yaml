services:
  db:
    image: postgres:18
    container_name: axi-wiki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wiki_preview
      POSTGRES_USER: wiki_preview
      POSTGRES_PASSWORD: ${PREVIEW_DB_PASSWORD:?Set the existing PREVIEW_DB_PASSWORD in Portainer}
    volumes:
      - database:/var/lib/postgresql
    networks: [database]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging:
      driver: local

  wiki:
    image: ghcr.io/requarks/wiki:3.1.1
    container_name: axi-wiki-app
    restart: unless-stopped
    environment:
      ADMIN_EMAIL: ${PREVIEW_ADMIN_EMAIL:?Set the existing PREVIEW_ADMIN_EMAIL}
      ADMIN_PASS: ${PREVIEW_ADMIN_PASSWORD:?Set the existing PREVIEW_ADMIN_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: wiki_preview
      DB_USER: wiki_preview
      DB_PASS: ${PREVIEW_DB_PASSWORD:?Set the existing PREVIEW_DB_PASSWORD}
      DB_SSL: "false"
    volumes:
      - content:/wiki/data/content
      - repo:/wiki/data/repo
    depends_on:
      db:
        condition: service_healthy
    networks: [database, proxy]
    logging:
      driver: local

networks:
  database:
    internal: true
  proxy:
    external: true
    name: axi-wiki_default

volumes:
  database:
    external: true
    name: axi-wiki-preview_preview_database
  content:
    external: true
    name: 0a1db937e12ab2af56a83c8397bdd023d25f673dcfcca6cca146de75c6eacc51
  repo:
    external: true
    name: e04f6aa260cc5609be8ab81a4a583a1bf056290a2f62c81d055a66e2aeaeb39a
